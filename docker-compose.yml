services:
  LDMG:
    image: ghcr.io/mbaigc/ldmg:main
    container_name: LDMG
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - PAGE_SIZE=${PAGE_SIZE:-6}
      - LOG_DIR=${LOG_DIR:-logs}
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 你的 compose 文件所在根目录（非常重要）
      - /docker:/mnt/data1/docker
      # /mnt/data1/docker为，docker compose容器所在路径，请按实填写
      # 如果需要访问其他路径，继续添加。- 未测试
